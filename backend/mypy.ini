[mypy]
ignore_missing_imports = True
python_version = 3.9

# SQLModel/SQLAlchemy: session.exec() and .where() use runtime magic that mypy
# cannot resolve — these overload/arg-type errors are false positives.
[mypy-app.auth]
disable_error_code = call-overload, arg-type

[mypy-app.routers.*]
disable_error_code = call-overload, arg-type

[mypy-app.notification_scheduler]
disable_error_code = call-overload, arg-type, union-attr
